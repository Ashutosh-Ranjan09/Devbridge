[project]
name = "cvv"
version = "0.1.0"
description = "CV Verification Engine — verifies developer CVs against the systems they name."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",       # connectors, liveness probes, and the Ollama client
    "pymupdf>=1.24",     # PDF text + bounding boxes
    "rapidfuzz>=3.10",   # span recovery, fuzzy tier
    "typer>=0.15",       # the CLI
    "structlog>=24.4",
    "python-docx>=1.1",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.32",
]

# Added when the phase that needs them lands, not before:
#   phase 3  selectolax          (CodeChef scrape, issuer pages)
#   phase 4  fastapi · psycopg[binary] · psycopg_pool · qdrant-client
#   phase 5  pandas · matplotlib
[project.optional-dependencies]
ocr = [
    "rapidocr-onnxruntime>=1.4",
]   # ~100 MB; scanned CVs only

[project.scripts]
cvv = "cvv.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "respx>=0.21",       # connectors tested against recorded responses
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvv"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]   # ruff formats python blocks inside markdown; docs are prose

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# En and em dashes are the DATA here, not a typo: real PDFs write "2019–23" and
# "2021 – present", and the parser exists to read them.
"tests/test_dates.py" = ["RUF001"]
"src/cvv/dates.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/cvv"]
# An unused ignore is a comment that has stopped being true. Left unchecked they
# accumulate and each one is a small lie about what the type checker is doing.
warn_unused_ignores = true

# rapidocr-onnxruntime ships no type information and is an OPTIONAL extra, so it is
# not installed in every environment this runs in. Scoped to that one package rather
# than relaxing the setting globally.
[[tool.mypy.overrides]]
module = ["rapidocr_onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
# `not live` by default: a test run must need no Ollama daemon, no token and no
# network. Run the excluded ones explicitly with `pytest -m live`.
addopts = "-q --strict-markers --import-mode=importlib -m 'not live'"
markers = [
    "live: needs something a default install and an offline machine do not have — a\n    real model, a real external API, or an optional extra; excluded by default",
]
