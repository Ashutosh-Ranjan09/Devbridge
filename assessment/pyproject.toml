[project]
name = "assess"
version = "0.1.0"
description = "DevBridge assessment — JD to confirmed skills to a unique, equally hard, sandboxed coding task."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",       # the model backends
    "typer>=0.15",       # the CLI
    "pyyaml>=6.0",       # patterns and the shared skill list
    "pytest>=8.3",       # runs hidden tests: locally for trusted code, in the sandbox for candidates
    "pytest-timeout>=2.3",
    "jsonschema>=4.23",  # every event batch is checked against the shared schema before it leaves
]

[project.scripts]
assess = "assess.cli:app"

[dependency-groups]
dev = [
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assess"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md", "patterns"]   # patterns hold candidate-facing code and deliberate mutants

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/assess"]
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
# `not live`, `not docker` and `not slow` by default: a test run needs no model and no
# daemon, and finishes in seconds.
addopts = "-q --strict-markers --import-mode=importlib -m 'not live and not docker and not slow'"
markers = [
    "slow: validates a pattern in every combination, over a minute; excluded by default",
    "live: needs a real model backend; excluded by default",
    "docker: needs a running Docker daemon and the sandbox image; excluded by default",
]
