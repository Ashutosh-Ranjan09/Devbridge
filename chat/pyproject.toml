[project]
name = "chat"
version = "0.1.0"
description = "DevBridge chat — a recruiter and a candidate, one thread per application, encrypted at rest."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",         # the CLI
    "fastapi>=0.115",      # the HTTP surface (chat serve)
    "uvicorn>=0.32",
    "cryptography>=43",    # AES-256-GCM for messages and files at rest
    "python-multipart>=0.0.20",   # FastAPI's file uploads
]

[project.scripts]
chat = "chat.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",         # FastAPI's TestClient
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/chat"]
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --import-mode=importlib"
