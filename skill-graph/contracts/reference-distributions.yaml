# DevBridge M6 — reference distributions for the observation model
#
# m6-parameters.yaml `observed_value.platform_rating` reads:
#     observed = a + b * ECDF_rated(rating)
# and says ECDF_rated is "built once from the Codeforces user list and stored as
# a lookup table — a for-loop, not a training run". This file is that table.
#
# It is DATA, not a parameter: the sweep does not touch it. It changes only when
# the underlying population is re-measured.
#
# PROVENANCE — read this before trusting the numbers.
#   These anchors are approximated from the published Codeforces rank boundaries
#   (newbie <1200, pupil 1200-1399, specialist 1400-1599, expert 1600-1899,
#   candidate master 1900-2099, master 2100-2299, international master 2300-2399,
#   grandmaster 2400+) and the widely reported shape of the rated population.
#   They have NOT been computed from the actual user list, because doing that
#   needs a network call this repository deliberately cannot make.
#
#   Regenerate before any published result: page /api/user.ratedList, take one
#   rating per handle, sort, and emit the empirical CDF at these anchors. The
#   loader interpolates, so the anchor grid can change freely.
#
#   Until then, treat platform_rating's observed value as approximate. It is the
#   single strongest event kind in the system (reliability 0.90), so an error
#   here matters more than an error anywhere else in observed_value.

codeforces_rated_ecdf:
  status: approximated_pending_regeneration
  measured_at: null
  population: rated_users_all_time
  interpolation: linear
  # rating -> fraction of RATED users at or below it
  anchors:
    800:  0.02
    1000: 0.15
    1200: 0.35
    1400: 0.55
    1600: 0.65
    1900: 0.82
    2100: 0.91
    2300: 0.96
    2400: 0.975
    2600: 0.99
    3000: 0.999
  worked_example:
    rating: 1495
    ecdf: 0.5975
    observed: 0.739
    note: >
      m6-parameters.yaml quotes "ECDF_rated ~0.60 -> 0.74" for this rating. The
      table reproduces that to three decimals, which is the check that the
      anchors are consistent with the published trace rather than free-floating.
