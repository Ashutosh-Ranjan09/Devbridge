# DevBridge M6 — reference distributions for the observation model
#
# m6-parameters.yaml `observed_value.platform_rating` reads:
#     observed = a + b * ECDF_rated(rating)
# and says ECDF_rated is "built once from the Codeforces user list and stored as
# a lookup table — a for-loop, not a training run". This file is that table.
#
# It is DATA, not a parameter: the sweep does not touch it. It changes only when
# the underlying population is re-measured.
#
# PROVENANCE.
#   Measured on 2026-10-31 from GET https://codeforces.com/api/user.ratedList
#   ?activeOnly=false&includeRetired=true: 987,113 rated handles, one row each. The
#   value at each anchor is the fraction of them whose PEAK rating (maxRating) is at
#   or below it — peak, because platform_rating prices the max_rating M5 reports.
#   Computed outside this repository, which makes no network calls:
#       peaks = sorted(u.get("maxRating", u["rating"]) for u in result)
#       ecdf(r) = bisect_right(peaks, r) / len(peaks)
#   The loader interpolates linearly between anchors, so the grid can change freely.
#
#   It replaced an approximation from the rank boundaries that put a 1495 peak at the
#   60th percentile; measured, it is the 84th (0.8374). The rated population is
#   everyone who ever played a rated round, many of them once, so a modest peak sits
#   high in it. The spike between 1400 and 1500 is the old 1500 starting rating.
#   Re-measure with the same call and formula; record the date and count here.

codeforces_rated_ecdf:
  status: measured
  measured_at: "2026-10-31"
  population: rated_users_all_time
  population_size: 987113
  statistic: max_rating
  interpolation: linear
  # peak rating -> fraction of RATED users whose peak is at or below it
  anchors:
    0: 0.0000
    100: 0.0000
    200: 0.0001
    300: 0.0001
    400: 0.1361
    500: 0.1781
    600: 0.2071
    700: 0.2514
    800: 0.3046
    900: 0.3796
    1000: 0.4505
    1100: 0.5105
    1200: 0.5584
    1300: 0.6035
    1400: 0.7131
    1500: 0.8404
    1600: 0.8838
    1700: 0.9236
    1800: 0.9492
    1900: 0.9624
    2000: 0.9747
    2100: 0.9820
    2200: 0.9900
    2300: 0.9942
    2400: 0.9963
    2500: 0.9978
    2600: 0.9986
    2700: 0.9991
    2800: 0.9994
    2900: 0.9996
    3000: 0.9997
    3200: 0.9999
    3500: 1.0000
    4000: 1.0000
  worked_example:
    rating: 1495
    ecdf: 0.8340
    observed: 0.8336
    note: >
      Interpolated between the 1400 and 1500 anchors (0.7131 -> 0.8404); the exact
      measured fraction is 0.8374. observed = 0.50 + 0.40 x ecdf.
